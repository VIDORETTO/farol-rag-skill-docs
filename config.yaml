# Farol 2.0 package configuration
# RAGFlow is the only factual backend selected by new packages. Credentials and
# endpoints are supplied through the external integration environment.
backend:
  name: ragflow
  version: "0.27.2"
  endpoint_env: DOCOPS_RAGFLOW_ENDPOINT
  token_env: DOCOPS_RAGFLOW_TOKEN
  transport: https-or-loopback-development

models:
  embedding:
    profile: compact
    model: BAAI/bge-small-en-v1.5
    dimensions: 384

search:
  default_results: 5
  max_results: 100

privacy:
  originals_private: true
  network_default: disabled
