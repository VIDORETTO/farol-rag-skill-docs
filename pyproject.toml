[build-system]
requires = ["setuptools>=84.0.0,<85.0.0", "wheel>=0.45.0,<0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-documentacao"
version = "1.1.0"
description = "Farol — portable, deterministic documentation-to-knowledge orchestration with optional local RAG/MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Farol contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/VIDORETTO/agent-knowledge-kit"
Repository = "https://github.com/VIDORETTO/agent-knowledge-kit"
Documentation = "https://github.com/VIDORETTO/agent-knowledge-kit/tree/main/docs"
Issues = "https://github.com/VIDORETTO/agent-knowledge-kit/issues"

[project.optional-dependencies]
rag = ["knowledge-rag==4.8.5"]
formats = ["PyYAML==6.0.3", "pypdf==6.18.0", "python-docx==1.2.0"]
dev = ["pytest==9.1.1", "ruff==0.12.7", "pip-audit==2.10.1", "setuptools==84.0.0"]

[project.scripts]
farol = "docops.__main__:main"
docops = "docops.__main__:main"

[tool.setuptools]
packages = ["docops", "docops.templates", "docops.schemas", "docops.presets"]

[tool.setuptools.package-data]
docops = ["templates/*.md", "schemas/*.json", "presets/*.json"]

[tool.setuptools.data-files]
"share/docops/skills/docops-agent" = ["skills/docops-agent/SKILL.md"]
"share/docops/skills/docops-agent/agents" = ["skills/docops-agent/agents/openai.yaml"]
"share/docops/skills/docops-agent/references" = ["skills/docops-agent/references/*.md"]
"share/docops/skills/docops-agent/scripts" = ["skills/docops-agent/scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
