name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

jobs:
  ragflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1" "setuptools==84.0.0"
      - name: Install RAGFlow integration
        run: python -m pip install --disable-pip-version-check -e ".[dev,formats,ragflow,ocr]"
      - name: Run the fail-closed RAGFlow/OCR profiles
        run: python scripts/run_release_gates.py --profile ragflow --timeout 900 --json > artifacts/ragflow-release-gates.json
      - name: Retain redacted integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-evidence-${{ github.sha }}
          path: |
            artifacts/ragflow-release-gates.json
          if-no-files-found: error
          retention-days: 30
