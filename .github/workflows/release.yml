name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and describe the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1" "setuptools==84.0.0" "build==1.3.0"
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/python -m pip install --disable-pip-version-check "$(ls dist/*.whl)[formats]"
          /tmp/release-venv/bin/farol doctor --json
      - name: Software bill of materials
        run: /tmp/release-venv/bin/python scripts/build_sbom.py sbom --distribution farol-kit --extras formats --output dist/farol-kit.cdx.json
      - name: Checksums
        run: python scripts/build_sbom.py checksums --directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/

  attest:
    name: Provenance attestation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    # Opt-in: set the repository variable PYPI_PUBLISH=true once the PyPI
    # trusted publisher for farol-kit (environment "pypi") exists.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/farol-kit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Keep only Python distributions
        run: find dist -type f ! -name "*.whl" ! -name "*.tar.gz" -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release with SBOM and checksums
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "Farol $GITHUB_REF_NAME" --notes-file "docs/RELEASE-NOTES-${GITHUB_REF_NAME#v}.md" --verify-tag
