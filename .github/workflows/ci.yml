name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_verification:
        description: "Run the fail-closed release identity and residual-risk gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quick:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1" "setuptools==84.0.0"
      - name: Install operator and test profile
        run: python -m pip install --disable-pip-version-check -e ".[dev,formats,rag]"
      - name: Exercise Python bootstrap wrapper
        run: python scripts/bootstrap.py --no-install
      - name: Exercise POSIX bootstrap wrapper
        if: runner.os != 'Windows'
        run: sh scripts/bootstrap.sh --no-install
      - name: Exercise PowerShell bootstrap wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -NoInstall
      - name: Exercise PowerShell operation wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/update_docs.ps1 -Sources documents/fixtures/acme-docs -Slug support-matrix -Output artifacts/support-matrix -License MIT
      - name: Remove no-install bootstrap probe environment
        run: python -c "import shutil; shutil.rmtree('.venv', ignore_errors=True)"
      - name: Doctor
        run: python -m docops doctor --json
      - name: Dependency audit
        run: python scripts/audit_dependencies.py --requirements requirements.lock --local --strict --evidence-dir artifacts/dependency-audit
      - name: Installed dependency consistency
        run: python -m pip check
      - name: Retain raw dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: artifacts/dependency-audit
          if-no-files-found: error
          retention-days: 30
      - name: Support matrix
        run: python scripts/check_support_matrix.py --json
      - name: Workflow YAML validation
        run: python scripts/validate_workflows.py --json
      - name: Contract conformance
        run: python scripts/check_contracts.py --json
      - name: Public seam test conformance
        run: python scripts/check_public_seams.py --json
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check docops tests scripts
      - name: Format check
        run: python -m ruff format --check docops tests scripts
      - name: Release audit
        run: python scripts/audit_release.py --tracked-only --json

  clean-clone:
    name: clean clone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1" "setuptools==84.0.0"
      - name: Install clean-clone test profile
        run: python -m pip install --disable-pip-version-check -e ".[dev,formats]"
      - name: Verify outside checkout state
        run: python scripts/verify_clean_clone.py --bootstrap

  package:
    name: wheel / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1" "setuptools==84.0.0"
      - name: Install audited candidate profile
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Build and smoke-test wheel
        run: python scripts/verify_wheel.py --core
      - name: Build candidate wheel artifact
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Generate supply-chain evidence
        run: python scripts/generate_supply_chain.py --root . --wheel "$(find dist -name '*.whl' -print -quit)" --output artifacts/supply-chain
      - name: Verify supply-chain evidence
        run: python scripts/verify_supply_chain.py --root . --evidence artifacts/supply-chain
      - name: Audit exact candidate file set
        run: python scripts/audit_release.py --candidate --json
      - name: Build unpublished candidate bundle
        run: python scripts/prepare_candidate.py --root . --output artifacts/candidate-2.0.0rc1
      - name: Verify unpublished candidate bundle
        run: python scripts/verify_candidate.py --root artifacts/candidate-2.0.0rc1
      - name: Re-measure candidate identity from the checkout
        run: python scripts/verify_candidate.py --root artifacts/candidate-2.0.0rc1 --source-root .
      - name: Retain candidate bundle and identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-2.0.0rc1-${{ github.sha }}
          path: artifacts/candidate-2.0.0rc1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Verify release identity on a pushed main commit
        if: github.event_name == 'workflow_dispatch' && inputs.release_verification == true && github.ref == 'refs/heads/main'
        run: python scripts/verify_candidate.py --root artifacts/candidate-2.0.0rc1 --source-root . --release
